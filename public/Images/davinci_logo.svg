<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Outer Rainbow Border Gradient -->
    <linearGradient id="dvr-rainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="25%" stop-color="#4facfe" />
      <stop offset="50%" stop-color="#9d4edd" />
      <stop offset="75%" stop-color="#ff4757" />
      <stop offset="100%" stop-color="#ffa502" />
    </linearGradient>

    <!-- Background Dark Gradient -->
    <linearGradient id="dvr-bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18243b" />
      <stop offset="100%" stop-color="#0b1220" />
    </linearGradient>

    <!-- Top Petal Gradient (Cyan / Blue) -->
    <linearGradient id="petal-cyan" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#56ccf2" />
      <stop offset="50%" stop-color="#2f80ed" />
      <stop offset="100%" stop-color="#0052d4" />
    </linearGradient>

    <!-- Bottom Left Petal Gradient (Yellow / Green) -->
    <linearGradient id="petal-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffee55" />
      <stop offset="50%" stop-color="#cddc39" />
      <stop offset="100%" stop-color="#7cb342" />
    </linearGradient>

    <!-- Bottom Right Petal Gradient (Red / Pink) -->
    <linearGradient id="petal-red" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5252" />
      <stop offset="50%" stop-color="#ff1744" />
      <stop offset="100%" stop-color="#f50057" />
    </linearGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="petal-gloss" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter for Petals -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Rounded Rectangle Card with Rainbow Border -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#dvr-bg-grad)" stroke="url(#dvr-rainbow)" stroke-width="3.5" />

  <!-- Inner Soft Glow Border -->
  <rect x="3.75" y="3.75" width="92.5" height="92.5" rx="20.25" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1" />

  <!-- Central Petals Group -->
  <g filter="url(#shadow)">
    <!-- Top Petal (Cyan/Blue) -->
    <g transform="rotate(0 50 50)">
      <path d="M 50 20.5 C 57.5 20.5 62.5 26.5 62.5 34 C 62.5 41 54 46.5 50 49 C 46 46.5 37.5 41 37.5 34 C 37.5 26.5 42.5 20.5 50 20.5 Z" fill="url(#petal-cyan)" />
      <path d="M 50 20.5 C 57.5 20.5 62.5 26.5 62.5 34 C 62.5 41 54 46.5 50 49 C 46 46.5 37.5 41 37.5 34 C 37.5 26.5 42.5 20.5 50 20.5 Z" fill="url(#petal-gloss)" opacity="0.75" />
    </g>

    <!-- Bottom Left Petal (Yellow/Green) -->
    <g transform="rotate(240 50 50)">
      <path d="M 50 20.5 C 57.5 20.5 62.5 26.5 62.5 34 C 62.5 41 54 46.5 50 49 C 46 46.5 37.5 41 37.5 34 C 37.5 26.5 42.5 20.5 50 20.5 Z" fill="url(#petal-yellow)" />
      <path d="M 50 20.5 C 57.5 20.5 62.5 26.5 62.5 34 C 62.5 41 54 46.5 50 49 C 46 46.5 37.5 41 37.5 34 C 37.5 26.5 42.5 20.5 50 20.5 Z" fill="url(#petal-gloss)" opacity="0.75" />
    </g>

    <!-- Bottom Right Petal (Red/Pink) -->
    <g transform="rotate(120 50 50)">
      <path d="M 50 20.5 C 57.5 20.5 62.5 26.5 62.5 34 C 62.5 41 54 46.5 50 49 C 46 46.5 37.5 41 37.5 34 C 37.5 26.5 42.5 20.5 50 20.5 Z" fill="url(#petal-red)" />
      <path d="M 50 20.5 C 57.5 20.5 62.5 26.5 62.5 34 C 62.5 41 54 46.5 50 49 C 46 46.5 37.5 41 37.5 34 C 37.5 26.5 42.5 20.5 50 20.5 Z" fill="url(#petal-gloss)" opacity="0.75" />
    </g>
  </g>
</svg>
